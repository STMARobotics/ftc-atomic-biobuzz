const d={"nx":34,"nz":34,"x0":6,"z0":6,"step":4,"cls":"xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx33333333333333333333333333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx3333333333xxxxxxxxxxxx3333333333xx1122223333xxxxxxxxxxxx2111111111xx11222233333333333332221111111100xx11122233333333333332221111111100xx11112222333333333332221111111100xx11112222233333333222211111111100xx11111222223333323222111111111100xx11111112222323322121111111111001xx11111111111212111111111111111001xx11111111111111111111111111110011xx11111111111111111111111011111011xx11111111111111111111110111110111xx11111111111111111111101111100111xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"},SZ=640,SC=SZ/144,ctx=document.getElementById("c").getContext("2d");
